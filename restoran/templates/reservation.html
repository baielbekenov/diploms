<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бронирование</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #09090f; --bg2: #111119; --bg3: #18181f; --bg4: #22222c;
  --gold: #c9a84c; --gold2: #e8c97a;
  --text: #f0ede6; --muted: #888;
  --border: rgba(201,168,76,.18); --r: 14px; --r2: 20px;
}
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 40px;
}
.header {
  display: flex; align-items: center; gap: 14px;
  padding: 20px 18px 16px;
  position: sticky; top: 0; z-index: 10;
  background: linear-gradient(to bottom, var(--bg) 70%, transparent);
}
.back-btn {
  background: var(--bg3);
  border: 1px solid var(--border);
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--text); font-size: 18px;
  cursor: pointer; text-decoration: none; flex-shrink: 0;
}
.header-title {
  font-family: 'Playfair Display', serif;
  font-size: 22px; font-weight: 600;
}
.form-wrap { padding: 8px 18px 24px; }
.field { margin-bottom: 18px; }
.field label {
  display: block;
  font-size: 11px; font-weight: 600;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 8px;
}
.field input,
.field select,
.field textarea {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px; padding: 13px 16px;
  outline: none; transition: border-color .2s;
  -webkit-appearance: none;
}
.field input:focus,
.field select:focus,
.field textarea:focus { border-color: var(--gold); }
.field textarea { resize: none; height: 90px; }
.field select option { background: #18181f; }
.fields-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.submit-btn {
  width: 100%;
  background: var(--gold); border: none;
  padding: 16px; border-radius: var(--r);
  font-size: 16px; font-family: 'DM Sans', sans-serif;
  font-weight: 600; color: #09090f;
  cursor: pointer; margin-top: 8px;
  transition: background .15s, transform .1s;
}
.submit-btn:active { background: var(--gold2); transform: scale(.98); }

/* messages */
.msg-error {
  background: rgba(220,50,50,.12);
  border: 1px solid rgba(220,50,50,.3);
  border-radius: 12px; padding: 12px 16px;
  color: #f87171; font-size: 14px; margin-bottom: 18px;
}

.section-title {
  font-family: 'Playfair Display', serif;
  font-size: 16px; font-weight: 600;
  color: var(--gold); margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
</style>
</head>
<body>
{% csrf_token %}

<div class="header">
  <a href="/" class="back-btn">←</a>
  <div>
    <div class="header-title">Бронирование</div>
  </div>
</div>

<div class="form-wrap">

  {% if messages %}
    {% for message in messages %}
      <div class="msg-error">{{ message }}</div>
    {% endfor %}
  {% endif %}

  <form method="post" action="{% url 'reservation' %}">
    {% csrf_token %}

    <div class="section-title">Контактные данные</div>

    <div class="field">
      <label>Ваше имя</label>
      <input type="text" name="name" placeholder="Иван Петров"
             value="{{ form_data.name|default:'' }}" autocomplete="name" required>
    </div>
    <div class="field">
      <label>Телефон</label>
      <input type="tel" name="phone" placeholder="+996 XXX XXX XXX"
             value="{{ form_data.phone|default:'' }}" autocomplete="tel" required>
    </div>

    <div class="section-title" style="margin-top:24px;">Детали брони</div>

    <div class="fields-row">
      <div class="field">
        <label>Дата</label>
        <input type="date" name="date" id="dateInput"
               value="{{ form_data.date|default:'' }}" required>
      </div>
      <div class="field">
        <label>Время</label>
        <input type="time" name="time"
               value="{{ form_data.time|default:'19:00' }}">
      </div>
    </div>

    <div class="field">
      <label>Количество гостей</label>
      <select name="guests">
        {% for n in "1234567"|make_list %}
          <option value="{{ n }}"
            {% if form_data.guests == n %}selected{% endif %}>
            {{ n }} {% if n == "1" %}гость{% elif n in "234" %}гостя{% else %}гостей{% endif %}
          </option>
        {% endfor %}
        <option value="8" {% if form_data.guests == "8" %}selected{% endif %}>8+ гостей</option>
      </select>
    </div>

    <div class="field">
      <label>Пожелания (необязательно)</label>
      <textarea name="notes"
        placeholder="Аллергии, особые пожелания, повод для встречи...">{{ form_data.notes|default:'' }}</textarea>
    </div>

    <button type="submit" class="submit-btn">Забронировать стол</button>
  </form>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.expand(); tg.setHeaderColor('#09090f'); }

// Устанавливаем минимальную дату — сегодня
const dateInput = document.getElementById('dateInput');
if (dateInput && !dateInput.value) {
  dateInput.min = new Date().toISOString().split('T')[0];
  dateInput.value = new Date().toISOString().split('T')[0];
}
</script>
</body>
</html>
