<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — EduCRM</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080C14; --card: #0F1520; --border: #1E2D47; --accent: #3B82F6;
            --accent-dim: rgba(59,130,246,0.15); --text: #E2E8F0; --text-muted: #64748B;
            --red: #EF4444; --red-dim: rgba(239,68,68,0.15);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Manrope', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(59,130,246,0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 40px;
        }
        .logo { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; color: var(--accent); margin-bottom: 6px; }
        .logo-sub { font-size: 12px; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 32px; }
        h1 { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
        .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 28px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 6px; }
        input[type="text"], input[type="password"] {
            width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
            color: var(--text); padding: 10px 14px; font-size: 14px; font-family: 'Manrope', sans-serif;
            transition: border-color 0.15s;
        }
        input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
        .btn-login {
            width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 8px;
            padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px;
            font-family: 'Manrope', sans-serif; transition: opacity 0.15s;
        }
        .btn-login:hover { opacity: 0.9; }
        .error { background: var(--red-dim); border: 1px solid rgba(239,68,68,0.3); color: var(--red); padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="logo">EduCRM</div>
    <div class="logo-sub">Образовательный центр</div>
    <h1>Добро пожаловать</h1>
    <p class="subtitle">Войдите в систему управления</p>

    {% if form.errors %}
    <div class="error">Неверное имя пользователя или пароль.</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Логин</label>
            <input type="text" name="username" autocomplete="username" autofocus required placeholder="admin">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" name="password" autocomplete="current-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-login">Войти →</button>
    </form>
</div>
</body>
</html>
