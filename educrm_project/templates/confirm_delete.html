{% extends 'base.html' %}
{% block title %}Удаление{% endblock %}
{% block page_title %}Подтверждение удаления{% endblock %}

{% block content %}
<div style="max-width:500px">
    <div class="card">
        <div class="card-body" style="padding:32px;text-align:center">
            <div style="width:60px;height:60px;background:var(--red-dim);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:24px;color:var(--red)">
                <i class="bi bi-exclamation-triangle"></i>
            </div>
            <div style="font-size:16px;font-weight:700;margin-bottom:8px">Удалить запись?</div>
            <div style="color:var(--text-muted);margin-bottom:24px;font-size:14px">
                Объект <strong style="color:var(--text)">«{{ object }}»</strong> будет удалён безвозвратно.
            </div>
            <div style="display:flex;gap:12px;justify-content:center">
                <a href="javascript:history.back()" class="btn-ghost" style="padding:10px 24px">Отмена</a>
                <form method="post" style="display:inline">
                    {% csrf_token %}
                    <button type="submit" class="btn-danger-custom" style="padding:10px 24px">
                        <i class="bi bi-trash"></i> Удалить
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
